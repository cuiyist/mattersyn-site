name: MatterSyn validated Pages release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mattersyn-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the public site source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a fresh, allowlisted public stage
        env:
          STAGE: ${{ runner.temp }}/mattersyn-site-stage
          RECEIPTS: ${{ runner.temp }}/mattersyn-site-receipts
        run: |
          python tools/mattersyn-release/export_release.py \
            --source-root "$GITHUB_WORKSPACE" \
            --destination "$STAGE" \
            --allowlist .release-control/site-allowlist.json \
            --registry .release-control/asset-rights-registry.json \
            --policy .release-control/site-policy.json \
            --repo mattersyn-site \
            --manifest-out "$RECEIPTS/release-manifest.json" \
            --report-out "$RECEIPTS/boundary-report.json"

      - name: Upload only the validated stage
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mattersyn-site-stage

  deploy:
    needs: build-and-validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
